<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // TODO: set these to your actual Supabase values before publishing
    const SUPABASE_URL = "https://fbfeejlvxqdmvafkidqm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_LScHsyJePM8y0_ehiyAI2w_6zB4KMka";

    // Initial task data is only a fallback; main source is Supabase
    const INITIAL_TASKS = [
      {
        id: "gateway-fix",
        title: "Fix OpenClaw gateway / sub-agent pairing",
        description: "Gateway currently rejects sub-agent spawns with a pairing error.",
        details: "Deep dive into OpenClaw gateway pairing: run gateway status, doctor, and logs to see why sessions_spawn fails, verify WebSocket binding on 127.0.0.1:18789, and adjust config or pairing settings so a minimal test sub-agent can spawn and respond successfully.",
        column: "todo"
      },
      {
        id: "supabase-setup",
        title: "Set up Supabase for knowledge + mood DB",
        description: "Supabase will be our single source of truth for knowledge, moods, and Kanban tasks.",
        details: "Design a minimal but robust schema (book_meta, book_chapters, mood_log, kanban_tasks, kanban_subtasks), create a Supabase project, run the SQL to create tables, and store the service key in ~/.secrets/supabase.json. Then implement a supabase-kb skill that can insert/read chapters, moods, and tasks so agents can query and update state across sessions.",
        column: "todo"
      },
      {
        id: "book-agent",
        title: "Implement book-writing agent",
        description: "Turn the book-writing plan into a real agent that writes and refines one chapter per day.",
        details: "Set up a separate workspace and agent configured specifically for long-form fiction, load BOOK_AGENT_PLAN.md as the blueprint, and wire three cron jobs (morning write, midday revision, evening mood conversation + finalization). Integrate Supabase for storing chapters, critiques, and moods, and ensure the agent sends you a daily chapter package after evening processing.",
        column: "todo"
      },
      {
        id: "tavily-setup",
        title: "Tavily search integration",
        description: "Replace the disabled Brave web_search with Tavily as a general web info source.",
        details: "Create a tavily-search skill that loads the Tavily API key from ~/.secrets/tavily.json, sends structured search queries to Tavily, and returns concise result lists (title, URL, snippet). Update our own behavior to prefer Tavily for documentation lookups, research questions, and other web-type queries instead of the built-in Brave web_search tool.",
        column: "todo"
      },
      {
        id: "rapidapi-setup",
        title: "RapidAPI setup",
        description: "Use RapidAPI as a shared gateway for flight search and news APIs.",
        details: "Sign up for RapidAPI in the browser, subscribe to at least one flight search API and one news API on free/cheap plans, and store the RapidAPI key in ~/.secrets/rapidapi.json. Build a generic rapidapi client skill that can call any RapidAPI host/endpoint and add thin wrappers (flight-search-rapidapi, news-rapidapi) that normalize responses into formats we can use for Miles&More calculations and mood analysis.",
        column: "todo"
      },
      {
        id: "robotics-investing",
        title: "Robotics + agentic AI investing plan",
        description: "Explore a small, themed portfolio around robotics + agentic AI from Germany.",
        details: "Research UCITS robotics/automation ETFs available to a German retail investor and identify 2–3 specific tickers for a core position. Then shortlist a few individual robotics/AI names (e.g. warehouse automation, industrial autonomy, robotics platforms) for a high-risk satellite allocation. The goal is to split ~1000 € into a relatively secure ETF core plus 1–3 speculative positions that could benefit disproportionately from agentic AI in robotics.",
        column: "todo"
      },
      {
        id: "google-oauth-fix",
        title: "Fix Gmail/Drive OAuth integration",
        description: "Repair the broken Gmail/Drive integration so scripted mail and uploads work again.",
        details: "In Google Cloud Console, create a fresh Desktop OAuth client for the dedicated Gmail account, configure the consent screen cleanly, and re-run the local OAuth flow with the scopes we actually need (gmail.modify, drive, calendar). Update ~/.secrets/google-oauth.json with the new client_id/client_secret/refresh_token and thoroughly re-test google_token.js, gmail_send.js, and drive_upload.js until both mail sending and Drive uploads behave reliably.",
        column: "todo"
      },
      {
        id: "android-apps",
        title: "Android apps pipeline",
        description: "Plan and ship small Kotlin apps (timer, clipboard, dev tools, etc.) and publish to Google Play.",
        column: "todo",
        subtasks: [
          {
            id: "android-apps-planning",
            title: "Define app ideas & select next project"
          },
          {
            id: "android-apps-play-store",
            title: "Set up Google Play Console and prepare publishing pipeline"
          }
        ]
      }
    ];

    function setupKanban() {
      let tasks = [];

      const supabase = window.supabase?.createClient
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } })
        : null;

      const columns = {
        todo: document.getElementById("col-todo"),
        doing: document.getElementById("col-doing"),
        done: document.getElementById("col-done")
      };

      const modal = document.getElementById("task-modal");
      const modalTitle = document.getElementById("task-modal-title");
      const modalBody = document.getElementById("task-modal-body");
      const modalClose = document.getElementById("task-modal-close");

      function openModal(task) {
        modalTitle.textContent = task.title;
        modalBody.innerHTML = "";

        const desc = document.createElement("p");
        desc.className = "mb-3 text-xs text-slate-200";
        desc.textContent = task.description || "";
        modalBody.appendChild(desc);

        if (task.details) {
          const details = document.createElement("p");
          details.className = "mb-3 text-xs text-slate-300";
          details.textContent = task.details;
          modalBody.appendChild(details);
        }

        if (task.subtasks && task.subtasks.length) {
          const h = document.createElement("h4");
          h.className = "mb-1 text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-400";
          h.textContent = "Subtasks";
          modalBody.appendChild(h);

          const ul = document.createElement("ul");
          ul.className = "mb-2 space-y-1";
          task.subtasks.forEach(st => {
            const li = document.createElement("li");
            li.className = "flex items-center text-[11px] text-slate-300";
            li.innerHTML = `<span class=\"mr-1 h-1.5 w-1.5 rounded-full bg-indigo-400\"></span>${st.title}`;
            ul.appendChild(li);
          });
          modalBody.appendChild(ul);
        }

        modal.classList.remove("hidden");
      }

      modalClose.addEventListener("click", () => {
        modal.classList.add("hidden");
      });

      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.classList.add("hidden");
      });

      function render() {
        Object.values(columns).forEach(col => (col.innerHTML = ""));
        tasks.forEach(task => {
          const card = document.createElement("div");
          card.className =
            "mb-3 rounded-xl border border-slate-700 bg-slate-900/80 p-3 shadow hover:border-indigo-500 cursor-grab";
          card.draggable = true;
          card.dataset.taskId = task.id;

          const title = document.createElement("div");
          title.className = "font-semibold text-sm mb-1 flex items-center justify-between";

          const left = document.createElement("div");
          left.className = "flex items-center gap-1";

          const dot = document.createElement("span");
          dot.className = "h-1.5 w-1.5 rounded-full";
          // priority: high (red), medium (amber), low (slate)
          const pri = task.priority || "medium";
          if (pri === "high") dot.classList.add("bg-red-400", "shadow-[0_0_8px_rgba(248,113,113,0.9)]");
          else if (pri === "low") dot.classList.add("bg-slate-500");
          else dot.classList.add("bg-amber-400", "shadow-[0_0_8px_rgba(251,191,36,0.9)]");

          const titleText = document.createElement("span");
          titleText.textContent = task.title;

          left.appendChild(dot);
          left.appendChild(titleText);

          title.appendChild(left);

          const desc = document.createElement("p");
          desc.className = "text-xs text-slate-300";
          desc.textContent = task.description || "";

          card.appendChild(title);
          card.appendChild(desc);

          if (task.subtasks && task.subtasks.length) {
            const ul = document.createElement("ul");
            ul.className = "mt-2 space-y-1";
            task.subtasks.forEach(st => {
              const li = document.createElement("li");
              li.className = "flex items-center text-[11px] text-slate-300";
              li.innerHTML = `<span class=\"mr-1 h-1.5 w-1.5 rounded-full bg-indigo-400\"></span>${st.title}`;
              ul.appendChild(li);
            });
            card.appendChild(ul);
          }

          // Drag & Drop handlers
          card.addEventListener("dragstart", (e) => {
            card.classList.add("opacity-60");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", task.id);
          });
          card.addEventListener("dragend", () => {
            card.classList.remove("opacity-60");
          });

          // Open details modal on click
          card.addEventListener("click", (e) => {
            // Ignore clicks that start a drag selection
            e.stopPropagation();
            const t = tasks.find(t => t.id === task.id);
            if (t) openModal(t);
          });

          const colEl = columns[task.column] || columns.todo;
          colEl.appendChild(card);
        });
      }

      // Enable drag & drop on columns
      Object.entries(columns).forEach(([columnKey, colEl]) => {
        colEl.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          colEl.classList.add("ring-1", "ring-indigo-500");
        });
        colEl.addEventListener("dragleave", () => {
          colEl.classList.remove("ring-1", "ring-indigo-500");
        });
        colEl.addEventListener("drop", (e) => {
          e.preventDefault();
          colEl.classList.remove("ring-1", "ring-indigo-500");
          const taskId = e.dataTransfer.getData("text/plain");
          if (!taskId) return;
          const t = tasks.find(t => t.id === taskId);
          if (!t) return;
          t.column = columnKey;
          saveTasks(tasks);
          render();
        });
      });

      // No add-task form (read-only dashboard)

      async function loadFromSupabase() {
        if (!supabase) {
          // Fallback to INITIAL_TASKS if Supabase is not configured
          tasks = INITIAL_TASKS.map(t => ({ ...t }));
          render();
          return;
        }
        const { data, error } = await supabase
          .from('kanban_tasks')
          .select('id, slug, title, description, details, status, priority')
          .order('created_at', { ascending: true });
        if (error) {
          console.error('Supabase error:', error.message);
          tasks = INITIAL_TASKS.map(t => ({ ...t }));
        } else {
          tasks = (data || []).map(row => ({
            id: row.id,
            title: row.title,
            description: row.description,
            details: row.details,
            column: row.status || 'todo',
            priority: row.priority || 'medium'
          }));
        }
        render();
      }

      loadFromSupabase();
    }

    document.addEventListener("DOMContentLoaded", setupKanban);
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800 bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950/80">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.9)]"></span>
        <span class="text-xs uppercase tracking-[0.2em] text-slate-400">OpenClaw</span>
      </div>
      <h1 class="text-sm font-semibold tracking-wide text-slate-100">Kanban Board</h1>
    </div>
  </header>

  <!-- Task details modal -->
  <div id="task-modal" class="fixed inset-0 z-30 hidden items-center justify-center bg-black/60 p-4">
    <div class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-950/95 p-4 shadow-2xl">
      <div class="mb-3 flex items-center justify-between">
        <h3 id="task-modal-title" class="text-sm font-semibold text-slate-100"></h3>
        <button id="task-modal-close" class="rounded-full border border-slate-600 px-2 py-0.5 text-[11px] text-slate-300 hover:border-slate-400">Close</button>
      </div>
      <div id="task-modal-body" class="text-xs text-slate-200"></div>
    </div>
  </div>

  <main class="mx-auto max-w-5xl px-4 pb-8 pt-4">
    <section class="mb-4">
      <div>
        <h2 class="text-base font-semibold">Workspace tasks</h2>
        <p class="text-xs text-slate-400">Read-only dashboard: columns reflect task status from Supabase (todo / doing / done). To add or change tasks, tell the agent and it will update Supabase for you.</p>
      </div>
    </section>

    <section class="grid gap-3 md:grid-cols-3">
      <div>
        <h3 class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Todo</h3>
        <div id="col-todo" class="rounded-xl border border-slate-800 bg-slate-900/70 p-2 min-h-[120px]"></div>
      </div>
      <div>
        <h3 class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Doing</h3>
        <div id="col-doing" class="rounded-xl border border-slate-800 bg-slate-900/70 p-2 min-h-[120px]"></div>
      </div>
      <div>
        <h3 class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">Done</h3>
        <div id="col-done" class="rounded-xl border border-slate-800 bg-slate-900/70 p-2 min-h-[120px]"></div>
      </div>
    </section>
  </main>
</body>
</html>
